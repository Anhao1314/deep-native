name: Offline verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Regression and negative tests (no model calls)
        run: python -m unittest discover -s tests -v
      - name: Reproduce the executed offline demo
        run: python examples/demo.py --output artifacts/ci-demo
