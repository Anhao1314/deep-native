name: Offline verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Regression and negative tests (no model calls)
        run: python -m unittest discover -s tests -v
      - name: Reproduce the executed offline demo
        run: python examples/demo.py --output artifacts/ci-demo
      - name: Validate Benchmark v1 contracts without model calls
        env:
          DN_BENCHMARK_CACHE: ${{ runner.temp }}/dn-upstream-cache
        run: |
          python -m pip install pytest==8.3.5 pluggy==1.6.0 packaging==26.3 iniconfig==2.3.0
          mkdir -p "$DN_BENCHMARK_CACHE"
          git clone https://github.com/mahmoud/boltons.git "$DN_BENCHMARK_CACHE/boltons"
          git clone https://github.com/more-itertools/more-itertools.git "$DN_BENCHMARK_CACHE/more"
          DN_BENCHMARK_PYTHON="$(command -v python)" python -m unittest discover -s tests -p test_benchmark_v1.py -v
